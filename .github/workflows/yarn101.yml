name: Extract GHSA IDs from Yarn Audit

on:
  push:
    branches:
      - "*" # Replace 'main' with your default branch if different
  workflow_dispatch:

jobs:
  extract-ghsa:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js and install dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Step 3: Run yarn audit and save the output
      - name: Run yarn audit
        id: yarn-audit
        run: |
          yarn audit > audit_output.txt

      # Step 4: Extract advisory IDs and fetch GHSA IDs
      - name: Extract GHSA IDs
        id: extract-ghsa
        run: |
          advisory_ids=$(grep "More info" audit_output.txt | sed -E 's/.*\/([0-9]+).*/\1/')
          ghsa_ids=()
          for id in $advisory_ids; do
            ghsa_id=$(curl -sL "https://www.npmjs.com/advisories/$id" | grep -o 'GHSA-[a-z0-9-]*' | head -n 1)
            if [ -n "$ghsa_id" ]; then
              ghsa_ids+=("$ghsa_id")
            fi
          done
          echo "GHSA_IDS=${ghsa_ids[*]}" >> $GITHUB_ENV

      # Step 5: Print the GHSA IDs
      - name: Print GHSA IDs
        run: |
          echo "Extracted GHSA IDs: ${{ env.GHSA_IDS }}"

      # Optional: Debug upload-artifact action
      - name: Debug upload-artifact action
        run: |
          curl -I https://api.github.com/repos/actions/upload-artifact/contents/action.yml

      # Optional: Save GHSA IDs as artifact
      - name: Save GHSA IDs as artifact
        uses: actions/upload-artifact@v2
        with:
          name: ghsa-ids
          path: |
            audit_output.txt
